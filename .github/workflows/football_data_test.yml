name: Football Data API Live Check
on:
  workflow_dispatch:
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live status
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          echo "=== LIVE STATUS CHECK ==="
          RESPONSE=$(curl -s \
            -H "X-Auth-Token: $FOOTBALL_DATA_API_TOKEN" \
            "https://api.football-data.org/v4/matches")
          echo "$RESPONSE" | python -c '
          import sys
          import json
          data = json.load(sys.stdin)
          if "error" in data:
              print("API STATUS: ERROR")
              print("ERROR:", data["error"])
              sys.exit(0)
          print("API STATUS: OK")
          matches = data.get("matches", [])
          for m in matches:
              status = m.get("status", "?")
              if status in ("IN_PLAY", "PAUSED", "LIVE"):
                  home = m.get("homeTeam", {}).get("name", "?")
                  away = m.get("awayTeam", {}).get("name", "?")
                  score = m.get("score", {}).get("fullTime", {})
                  print(
                      "LIVE:",
                      home,
                      score.get("home", "?"),
                      "-",
                      score.get("away", "?"),
                      away,
                      "| STATUS=", status,
                      "| UPDATED=", m.get("lastUpdated")
                  )
          print("TOTAL MATCHES:", len(matches))
          '
          echo "=== END LIVE STATUS CHECK ==="

