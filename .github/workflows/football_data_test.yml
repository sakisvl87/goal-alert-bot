name: Football Data API Match Details Test
on:
  workflow_dispatch:
jobs:
  test-match:
    runs-on: ubuntu-latest
    steps:
      - name: Test Match Details
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          echo "=== FOOTBALL-DATA MATCH TEST ==="
          RESPONSE=$(curl -s \
            -H "X-Auth-Token: $FOOTBALL_DATA_API_TOKEN" \
            "https://api.football-data.org/v4/matches/558457")
          echo "$RESPONSE" | python -c '
          import sys
          import json
          try:
              data = json.load(sys.stdin)
              if "error" in data:
                  print("API STATUS: ERROR")
                  print("ERROR:", data["error"])
              else:
                  print("API STATUS: OK")
                  print("MATCH:", data.get("homeTeam", {}).get("name"),
                        "-", data.get("awayTeam", {}).get("name"))
                  print("STATUS:", data.get("status"))
                  score = data.get("score", {})
                  print("SCORE:", score)
                  print("LAST UPDATED:", data.get("lastUpdated"))
                  print("GOALS/EVENTS:")
                  for g in data.get("goals", []):
                      print(g)
          except Exception as e:
              print("API STATUS: ERROR")
              print("ERROR:", str(e))
          '
          echo "=== END MATCH TEST ==="
