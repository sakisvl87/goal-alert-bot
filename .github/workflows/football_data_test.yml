name: Football Data API Today Test
on:
  workflow_dispatch:
jobs:
  test-today:
    runs-on: ubuntu-latest
    steps:
      - name: Test Today's Matches
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          echo "=== FOOTBALL-DATA TODAY TEST ==="
          RESPONSE=$(curl -s \
            -H "X-Auth-Token: $FOOTBALL_DATA_API_TOKEN" \
            "https://api.football-data.org/v4/matches")
          echo "$RESPONSE" | python -c '
          import sys
          import json
          try:
              data = json.load(sys.stdin)
              if "error" in data:
                  print("API STATUS: ERROR")
                  print("ERROR:", data["error"])
              else:
                  matches = data.get("matches", [])
                  print("API STATUS: OK")
                  print("MATCHES:", len(matches))
                  for m in matches:
                      competition = m.get("competition", {}).get("name", "?")
                      home = m.get("homeTeam", {}).get("name", "?")
                      away = m.get("awayTeam", {}).get("name", "?")
                      status = m.get("status", "?")
                      score = m.get("score", {}).get("fullTime", {})
                      print(
                          "- {} | {} {} - {} {} | STATUS={}".format(
                              competition,
                              home,
                              score.get("home", "?"),
                              score.get("away", "?"),
                              away,
                              status
                          )
                      )
          except Exception as e:
              print("API STATUS: ERROR")
              print("ERROR:", str(e))
          '
          echo "=== END TODAY TEST ==="
