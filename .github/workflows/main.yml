name: Goal Alert Bot

on:
  workflow_dispatch:

jobs:
  goal-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Run Goal Alert
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          API_KEY = os.environ["API_FOOTBALL_KEY"]
          TELEGRAM_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = "6642584190"

          headers = {
              "x-apisports-key": API_KEY
          }

          r = requests.get(
              "https://v3.football.api-sports.io/fixtures",
              headers=headers,
              params={"live": "all"},
              timeout=20
          )

          data = r.json()
          matches = data.get("response", [])

          print("Live matches:", len(matches))

          BIG_LEAGUES = {
              39: "Premier League",
              140: "La Liga",
              135: "Serie A",
              78: "Bundesliga",
              61: "Ligue 1",
              2: "Champions League",
              3: "Europa League",
              88: "Eredivisie",
              94: "Primeira Liga",
              197: "Super League Greece"
          }

          alerts = []

          for match in matches:

              league_id = match["league"]["id"]

              if league_id not in BIG_LEAGUES:
                  continue

              status = match["fixture"]["status"]["short"]
              minute = match["fixture"]["status"].get("elapsed") or 0

              if status not in ["1H", "2H"]:
                  continue

              if minute < 20:
                  continue

              fixture_id = match["fixture"]["id"]

              home = match["teams"]["home"]["name"]
              away = match["teams"]["away"]["name"]

              home_goals = match["goals"]["home"] or 0
              away_goals = match["goals"]["away"] or 0

              stats = requests.get(
                  "https://v3.football.api-sports.io/fixtures/statistics",
                  headers=headers,
                  params={"fixture": fixture_id},
                  timeout=20
              ).json()

              teams = stats.get("response", [])

              if len(teams) < 2:
                  continue

              def stat(team, name):
                  for x in team.get("statistics", []):
                      if x.get("type") == name:
                          value = x.get("value")

                          if isinstance(value, str):
                              value = value.replace("%", "")

                          try:
                              return float(value)
                          except:
                              return 0
                  return 0

              h = teams[0]
              a = teams[1]

              shots = stat(h, "Total Shots") + stat(a, "Total Shots")
              target = stat(h, "Shots on Goal") + stat(a, "Shots on Goal")
              corners = stat(h, "Corner Kicks") + stat(a, "Corner Kicks")

              possession_h = stat(h, "Ball Possession")
              possession_a = stat(a, "Ball Possession")

              score = 0

              score += min(shots * 1.5, 15)
              score += min(target * 4, 25)
              score += min(corners * 1.5, 10)

              score += min(
                  abs(possession_h - possession_a) * 0.5,
                  10
              )

              if minute >= 55:
                  score += 10

              if minute >= 70:
                  score += 10

              if home_goals == away_goals:
                  score += 10

              score = min(round(score), 100)

              print(
                  home,
                  away,
                  "minute:",
                  minute,
                  "score:",
                  score
              )

              if score >= 70:

                  alerts.append(
                      f"🔥 GOAL ALERT — {score}/100\n\n"
                      f"⚽ {home} {home_goals} - "
                      f"{away_goals} {away}\n"
                      f"🏆 {BIG_LEAGUES[league_id]}\n"
                      f"⏱ {minute}'\n\n"
                      f"📊 Shots: {int(shots)}\n"
                      f"🎯 On target: {int(target)}\n"
                      f"🚩 Corners: {int(corners)}\n\n"
                      f"⚠️ Υψηλή πίεση για γκολ"
                  )

          if alerts:

              for message in alerts:

                  requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                      data={
                          "chat_id": CHAT_ID,
                          "text": message
                      },
                      timeout=20
                  )

          else:

              requests.post(
                  f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                  data={
                      "chat_id": CHAT_ID,
                      "text": "✅ Goal Alert Bot λειτουργεί.\n\nΔεν βρέθηκε αυτή τη στιγμή σήμα ≥70."
                  },
                  timeout=20
              )

          print("SCAN COMPLETE")
          PY
