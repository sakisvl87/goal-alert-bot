name: 5Dollar Live Goals Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test live matches and goals
        env:
          API_KEY: ${{ secrets.FIVE_DOLLAR_API_KEY }}

        run: |
          echo "=== 5DOLLAR LIVE GOALS TEST ==="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $API_KEY" \
            "https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=events&per_page=500")

          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["RESPONSE"])

          if data.get("success") != 1:
              print("API STATUS: ERROR")
              print(data)
              sys.exit(1)

          matches = data.get("data", [])

          print("API STATUS: OK")
          print("LIVE MATCHES:", len(matches))

          goals_found = 0

          for match in matches:
              teams = match.get("teams", {})
              home = teams.get("home", {}).get("name", "?")
              away = teams.get("away", {}).get("name", "?")

              goals = match.get("goals", {})
              events = match.get("events", [])

              print()
              print(f"MATCH: {home} - {away}")
              print(f"SCORE: {goals}")

              for event in events:
                  if event.get("type") == "goal":
                      goals_found += 1
                      print("GOAL EVENT:", event)

          print()
          print("GOALS FOUND:", goals_found)
          print("=== END TEST ===")
          PY
