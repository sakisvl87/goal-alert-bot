name: 5Dollar Fixture Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find fixture and test events
        env:
          API_KEY: ${{ secrets.FIVE_DOLLAR_API_KEY }}

        run: |
          echo "=== 5DOLLAR FIXTURE TEST ==="

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $API_KEY" \
            "https://api.5dollarfootballapi.com/v1/fixtures?per_page=1")

          RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          data = json.loads(os.environ["RESPONSE"])

          if data.get("success") != 1:
              print("FIXTURES API: ERROR")
              print(data)
              sys.exit(1)

          fixtures = data.get("data", [])

          if not fixtures:
              print("NO FIXTURES FOUND")
              sys.exit(1)

          fixture = fixtures[0]

          fixture_id = fixture.get("id")
          teams = fixture.get("teams", {})
          home = teams.get("home", {}).get("name", "?")
          away = teams.get("away", {}).get("name", "?")
          status = fixture.get("status")
          goals = fixture.get("goals", {})

          print("FIXTURES API: OK")
          print("FIXTURE ID:", fixture_id)
          print("MATCH:", home, "-", away)
          print("STATUS:", status)
          print("SCORE:", goals)

          url = (
              "https://api.5dollarfootballapi.com"
              f"/v1/fixtures/{fixture_id}/statistics"
          )

          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["API_KEY"]}
          )

          with urllib.request.urlopen(request) as response:
              events_data = json.loads(response.read())

          print("EVENTS API STATUS:", "OK" if events_data.get("success") == 1 else "ERROR")

          if events_data.get("success") != 1:
              print(events_data)
              sys.exit(1)

          events = events_data.get("data", [])

          print("EVENTS RECEIVED:", len(events))

          for event in events:
              print(event)

          print("=== END FIXTURE TEST ===")
          PY
