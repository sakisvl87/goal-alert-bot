name: Football Data API Live Test
on:
  workflow_dispatch:
jobs:
  test-live:
    runs-on: ubuntu-latest
    steps:
      - name: Test Live Matches
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          echo "=== FOOTBALL-DATA LIVE TEST ==="
          RESPONSE=$(curl -s \
            -H "X-Auth-Token: $FOOTBALL_DATA_API_TOKEN" \
            "https://api.football-data.org/v4/matches?status=LIVE")
          echo "$RESPONSE" | python -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
              if "error" in data:
                  print("API STATUS: ERROR")
                  print("ERROR:", data["error"])
              else:
                  matches = data.get("matches", [])
                  print("API STATUS: OK")
                  print("LIVE MATCHES:", len(matches))
                  for m in matches:
                      home = m.get("homeTeam", {}).get("name", "?")
                      away = m.get("awayTeam", {}).get("name", "?")
                      score = m.get("score", {}).get("fullTime", {})
                      status = m.get("status", "?")
                      minute = m.get("minute", "?")
                      print(
                          f"- {home} {score.get(\"home\", \"?\")} - "
                          f"{score.get(\"away\", \"?\")} {away} | "
                          f"STATUS={status} | MINUTE={minute}"
                      )
          except Exception as e:
              print("API STATUS: ERROR")
              print("ERROR:", str(e))
          '
          echo "=== END LIVE TEST ==="

